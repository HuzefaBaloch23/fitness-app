# Builds an UNSIGNED .ipa on a macOS runner.
#
# Why unsigned: signing needs an Apple Developer account. Sideloadly / AltStore /
# SideStore re-sign the .ipa with your own free Apple ID on the way to the phone,
# so CI never needs your credentials.
#
# Download the artifact from the run's summary page, then sideload it.
name: iOS build

# The repo is public, so macOS runner minutes are unlimited and every push can
# produce a fresh .ipa. If it ever goes private, drop the `push:` trigger --
# macOS bills at 10x there, leaving only ~200 real minutes a month.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Resolve workspace and scheme
        id: xc
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"
          echo "Building scheme '$SCHEME' from '$WORKSPACE'"

      - name: Build (code signing disabled)
        run: >-
          xcodebuild
          -workspace "${{ steps.xc.outputs.workspace }}"
          -scheme "${{ steps.xc.outputs.scheme }}"
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          -quiet
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          CODE_SIGN_ENTITLEMENTS=""
          build

      - name: Package into an .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${{ steps.xc.outputs.scheme }}-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: "*.ipa"
          retention-days: 30
